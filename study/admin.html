<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Study · 主试控制台</title>
    <link rel="stylesheet" href="study.css?v=2026-09-29.1" />
  </head>
  <body class="admin-body">
    <header class="admin-head">
      <h1>Study Console <span class="muted" id="head-pid"></span></h1>
      <div class="conn">
        <span class="dot" id="dot-srv"></span>服务器
        <span class="dot" id="dot-run"></span>显示端 <span id="run-code" class="muted"></span>
        <span class="dot" id="dot-phone"></span>手机
        <span class="dot" id="dot-intake"></span>开始问卷
        <span class="dot" id="dot-final"></span>结束问卷
      </div>
    </header>

    <div class="admin-grid">
      <aside>
        <section class="card">
          <h2>连接</h2>
          <div class="field"><label for="token">口令</label><input id="token" type="password" placeholder="STUDY_ADMIN_TOKEN" /></div>
          <div class="btns"><button class="btn" id="btn-connect">连接服务器</button></div>
          <div id="rooms" style="margin-top:8px" class="muted">未连接</div>
        </section>

        <section class="card">
          <h2>被试</h2>
          <div class="field">
            <label for="pid">编号</label>
            <input id="pid" placeholder="P01" />
          </div>
          <div class="btns">
            <button class="btn primary" id="btn-setup">建立 / 恢复会话</button>
          </div>
          <p class="muted" style="margin-top:8px">同一编号再次建立 = 从中断处继续。条件顺序按编号数字轮换（Latin square），短语由服务器按编号固定抽取。</p>
        </section>

        <section class="card">
          <h2>流程</h2>
          <div class="order" id="order"></div>
        </section>

        <section class="card">
          <h2>配置（来自服务器）</h2>
          <dl class="kv" id="config"></dl>
        </section>
      </aside>

      <main>
        <section class="card">
          <h2>实时镜像</h2>
          <div class="mirror">
            <div class="m-meta" id="m-meta">—</div>
            <div class="m-target" id="m-target"></div>
            <div class="m-typed" id="m-typed"></div>
            <div class="m-cands" id="m-cands"></div>
            <div class="m-cands" id="m-err" style="color:var(--down)"></div>
          </div>
          <div class="btns" style="margin-top:10px">
            <button class="btn primary" data-cmd="start">▶ 开始 / 继续 <kbd>S</kbd></button>
            <button class="btn" data-cmd="pause">⏸ 暂停 <kbd>P</kbd></button>
            <button class="btn" data-cmd="redo">⟲ 重做本句 <kbd>R</kbd></button>
            <button class="btn" data-cmd="next">⏭ 强制提交 <kbd>N</kbd></button>
          </div>
          <div class="field" style="margin:10px 0 0">
            <input class="note-input" id="note" placeholder="备注（回车保存，附到当前 trial）" />
          </div>
        </section>

        <section class="card">
          <h2>Trials <span class="muted" id="trial-count"></span></h2>
          <div class="scroll">
            <table class="tbl">
              <thead>
                <tr>
                  <th>条件</th><th>#</th><th>target / typed</th>
                  <th class="n">WPM</th><th class="n">CER</th><th class="n">笔画</th><th></th>
                </tr>
              </thead>
              <tbody id="trials"></tbody>
            </table>
          </div>
        </section>
      </main>

      <aside>
        <section class="card">
          <h2>汇总（不含练习 / 无效 / 空提交）</h2>
          <table class="tbl" id="summary"></table>
        </section>
        <section class="card">
          <h2>评分</h2>
          <div id="ratings" class="muted">—</div>
        </section>
        <section class="card">
          <h2>问卷（手机）</h2>
          <div id="questionnaires" class="muted">—</div>
        </section>
        <section class="card">
          <h2>导出</h2>
          <div class="btns">
            <button class="btn" id="exp-csv">trials.csv（本页）</button>
          </div>
          <p class="muted" style="margin-top:6px">完整数据（原始事件、轨迹）在服务器上用 <code>export_study.py</code> 导出。</p>
        </section>
      </aside>
    </div>

    <script src="config.js?v=2026-09-29.1"></script>
    <script src="common.js?v=2026-09-29.1"></script>
    <script src="admin.js?v=2026-09-29.1"></script>
  </body>
</html>
