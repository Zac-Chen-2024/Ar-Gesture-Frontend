<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition preview · digital scan</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <style>
      :root { --paper: #faf8f3; --ink: #111; --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--paper); font-family: var(--font-ui); }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--paper); }
      #dest { visibility: hidden; }
      .bar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 2147483600; display: flex; gap: 6px; align-items: center;
        background: #fff; border: 1px solid var(--ink); padding: 6px 8px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
      .bar span { color: rgba(17,17,17,.5); margin: 0 4px; }
      .bar button { font: inherit; padding: 5px 12px; border: 1px solid var(--ink); background: none; cursor: pointer; }
      .bar button.is-on { background: var(--ink); color: var(--paper); }
      /* the transition */
      .tx { position: fixed; inset: 0; z-index: 2147483000; pointer-events: none; }
      .tx canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .tx .mark { position: absolute; left: 50%; top: 50%; width: min(46vmin, 360px); aspect-ratio: 1; transform: translate(-50%, -50%); }
      .tx .mark svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <iframe id="home" src="../index.html" title="Home"></iframe>
    <iframe id="dest" title="Destination"></iframe>
    <div class="bar">
      <span>Play</span>
      <button data-go="green">Demo</button>
      <button data-go="red">Game</button>
      <span>Speed</span>
      <button data-speed="1" class="is-on">1×</button>
      <button data-speed="3">⅓×</button>
    </div>

    <script>
      // Leaving: the page fades to paper and the mark draws itself as far as
      // the solid eight. Arriving: one thin scan line runs down the whole
      // screen. Above it the new page shows through a narrow band of pixels;
      // where it crosses the mark's right half, the half turns to pixels.
      const PAPER = "#faf8f3", ACCENT = { green: "#25915f", red: "#d6452b" };
      const DEST = { green: "../display.html", red: "../study-funny/display.html" };
      let slow = 1;
      const wait = (ms) => new Promise((done) => setTimeout(done, ms * slow));
      const inOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const svgText = (name) => fetch(`../brand/xblab/${name}`).then((r) => r.text());
      function inline(text) {
        const box = document.createElement("div");
        box.innerHTML = text;
        const svg = box.querySelector("svg");
        svg.removeAttribute("width");
        svg.removeAttribute("height");
        return svg;
      }
      function frames(ms, fn) {
        return new Promise((done) => {
          const t0 = performance.now(), len = ms * slow;
          (function step(now) {
            const p = Math.min(1, (now - t0) / len);
            fn(p);
            if (p < 1) requestAnimationFrame(step); else done();
          })(t0);
        });
      }

      async function play(colour) {
        document.querySelectorAll(".tx").forEach((e) => e.remove());
        const home = document.getElementById("home"), dest = document.getElementById("dest");
        home.style.visibility = "visible";
        dest.style.visibility = "hidden";
        const [draw, solid, pixels] = await Promise.all([
          svgText(`xblab-mark-draw-${colour}.svg`), svgText(`xblab-mark-solid-${colour}.svg`), svgText(`xblab-mark-pixels-${colour}.svg`)]);
        dest.src = DEST[colour];

        const tx = document.createElement("div");
        tx.className = "tx";
        const canvas = document.createElement("canvas");
        const mark = document.createElement("div");
        mark.className = "mark";
        tx.append(canvas, mark);
        document.body.appendChild(tx);
        const dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        const ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);

        // ---- leaving: fade to paper, the mark draws itself
        await frames(200, (p) => { ctx.clearRect(0, 0, W, H); ctx.globalAlpha = p; ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; });
        const drawSvg = inline(draw);
        drawSvg.querySelector("rect")?.remove(); // its paper ground: the canvas is the ground
        mark.appendChild(drawSvg);
        drawSvg.pauseAnimations();
        drawSvg.setCurrentTime(0);
        const dur = parseFloat(drawSvg.querySelector("animate").getAttribute("dur")) * 1000;
        if (slow === 1) drawSvg.unpauseAnimations();
        else await frames(dur, (p) => drawSvg.setCurrentTime((p * dur) / 1000));
        await wait(slow === 1 ? dur + 40 : 0);

        // ---- the page changes under the cover (in the site: the navigation)
        const solidSvg = inline(solid), pixelSvg = inline(pixels);
        mark.replaceChildren(solidSvg, pixelSvg);
        pixelSvg.style.clipPath = "inset(0 0 100% 0)";
        home.style.visibility = "hidden";
        dest.style.visibility = "visible";
        await wait(140);

        // ---- arriving: one scan line down the whole screen
        const CELL = 12, BAND = 56, cols = Math.ceil(W / CELL), rows = Math.ceil(H / CELL);
        const seed = Array.from({ length: cols * rows }, () => Math.random());
        const m = mark.getBoundingClientRect();
        await frames(640, (p) => {
          const y = (H + BAND) * inOut(p) - 2; // the line, from the top edge to past the bottom
          ctx.clearRect(0, 0, W, H);
          ctx.fillStyle = PAPER;
          // below the line: still paper; in the band above it: pixels dropping out
          for (let r = 0; r < rows; r++) {
            const top = r * CELL;
            if (top >= y) { ctx.fillRect(0, top, W, CELL); continue; }
            const into = (y - (top + CELL)) / BAND; // 0 at the line, 1 at the band's top
            if (into >= 1) continue;
            for (let c = 0; c < cols; c++) if (seed[r * cols + c] > into) ctx.fillRect(c * CELL, top, CELL, CELL);
          }
          ctx.fillStyle = PAPER;
          ctx.fillRect(0, Math.max(0, y), W, H);
          // the line itself
          ctx.save();
          ctx.strokeStyle = ACCENT[colour];
          ctx.globalAlpha = 0.85;
          ctx.lineWidth = 1.5;
          ctx.shadowColor = ACCENT[colour];
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.moveTo(0, y + 0.5);
          ctx.lineTo(W, y + 0.5);
          ctx.stroke();
          ctx.restore();
          // the mark: pixels above the line, solid below
          const rel = Math.max(0, Math.min(m.height, y - m.top));
          solidSvg.style.clipPath = `inset(${rel}px 0 0 0)`;
          pixelSvg.style.clipPath = `inset(0 0 ${m.height - rel}px 0)`;
        });
        ctx.clearRect(0, 0, W, H);

        // ---- the finished mark gives way to the page
        await frames(280, (p) => { mark.style.opacity = String(1 - p); });
        tx.remove();
      }

      document.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => play(b.dataset.go)));
      document.querySelectorAll("[data-speed]").forEach((b) => b.addEventListener("click", () => {
        slow = Number(b.dataset.speed);
        document.querySelectorAll("[data-speed]").forEach((x) => x.classList.toggle("is-on", x === b));
      }));
      window.playScan = play;
    </script>
  </body>
</html>
