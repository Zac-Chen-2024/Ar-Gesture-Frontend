<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ar-Gesture</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      /* Editorial look, matching the display's default style: paper, serif
         type, black hairlines, one red accent (the gesture trace). */
      :root {
        --paper: #faf8f3;
        --ink: #111111;
        --ink-soft: rgba(17, 17, 17, 0.62);
        --ink-faint: rgba(17, 17, 17, 0.45);
        --red: #d6452b;
        --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino,
          "Book Antiqua", Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 34rem;
        text-align: center;
      }

      .kicker {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      h1 {
        margin: 14px 0 0;
        font-family: var(--font-serif);
        font-size: clamp(2.8rem, 11vw, 4.4rem);
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1;
      }

      /* a swipe drawn under the title, in the display's trace red */
      .trace {
        display: block;
        width: min(15rem, 70%);
        height: 26px;
        margin: 10px auto 0;
        overflow: visible;
      }

      .trace path {
        fill: none;
        stroke: var(--red);
        stroke-width: 2.5;
        stroke-linecap: round;
      }

      .trace circle {
        fill: var(--red);
      }

      .lede {
        margin: 22px auto 0;
        max-width: 28rem;
        font-family: var(--font-serif);
        font-size: 1.12rem;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .lede strong {
        font-weight: 400;
        font-style: italic;
        color: var(--ink);
      }

      .links {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-top: 34px;
        border: 1px solid var(--ink);
      }

      a.btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 20px 16px;
        text-decoration: none;
        color: var(--ink);
        transition: background-color 140ms ease, color 140ms ease;
      }

      a.btn + a.btn {
        border-left: 1px solid var(--ink);
      }

      a.btn .btn-title {
        transition: color 140ms ease;
      }

      .btn-title {
        font-family: var(--font-serif);
        font-size: 1.6rem;
        line-height: 1.1;
      }

      .btn-sub {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.6;
      }

      a.btn:hover {
        background: rgba(17, 17, 17, 0.06);
      }

      a.btn:hover .btn-title {
        color: var(--red);
      }

      a.btn:focus-visible {
        outline: 2px solid var(--red);
        outline-offset: -4px;
      }

      .phone-link {
        margin: 18px 0 0;
        font-family: var(--font-serif);
        font-size: 0.95rem;
        color: var(--ink-faint);
      }
      .phone-link a {
        color: var(--ink-soft);
      }

      /* each mode button carries its own small picture */
      .art {
        display: block;
        width: 120px;
        height: 44px;
        margin-bottom: 6px;
        overflow: visible;
      }
      .art-demo .keys rect {
        fill: none;
        stroke: rgba(17, 17, 17, 0.35);
        stroke-width: 0.8;
      }
      .art-demo .swipe {
        fill: none;
        stroke: var(--red);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
      }
      .art-demo .tip {
        fill: var(--red);
      }
      a.btn:hover .art-demo .swipe {
        animation: art-draw 900ms ease-out;
      }
      @keyframes art-draw {
        from { stroke-dashoffset: 1; }
        to { stroke-dashoffset: 0; }
      }
      .art-game .pad {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1.6;
        stroke-linejoin: round;
      }
      .art-game .dpad {
        stroke: var(--ink);
        stroke-width: 3;
        stroke-linecap: round;
      }
      .art-game .btn-a, .art-game .btn-b { fill: var(--red); }
      .art-game .btn-c, .art-game .btn-d { fill: var(--ink); }
      .art-game .sparks {
        stroke: var(--red);
        stroke-width: 1.6;
        stroke-linecap: round;
        opacity: 0;
        transition: opacity 200ms ease, transform 260ms cubic-bezier(.2, 1.6, .4, 1);
        transform-origin: 60px 8px;
        transform: translateY(4px);
      }
      a.btn:hover .art-game { animation: art-wiggle 420ms ease-in-out; }
      a.btn:hover .art-game .sparks { opacity: 1; transform: none; }
      a.btn:hover .art-game .btn-a { animation: art-press 420ms ease-in-out; }
      @keyframes art-wiggle {
        25% { transform: rotate(-5deg); }
        60% { transform: rotate(4deg); }
      }
      @keyframes art-press {
        40% { transform: translateY(1.5px); fill: var(--ink); }
      }
      .art-game .btn-a { transform-box: fill-box; }
      @media (prefers-reduced-motion: reduce) {
        a.btn:hover .art-demo .swipe, a.btn:hover .art-game, a.btn:hover .art-game .btn-a { animation: none; }
      }

      @media (max-width: 420px) {
        .links {
          grid-template-columns: 1fr;
        }

        a.btn + a.btn {
          border-left: none;
          border-top: 1px solid var(--ink);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="kicker">AR text entry</p>
      <h1>Ar-Gesture</h1>
      <svg class="trace" viewBox="0 0 240 26" aria-hidden="true">
        <path d="M6 18 C 40 2, 62 24, 96 12 S 150 2, 176 16 S 214 20, 232 8" />
        <circle cx="232" cy="8" r="4" />
      </svg>
      <nav class="links">
        <a class="btn demo" href="display.html">
          <svg class="art art-demo" viewBox="0 0 120 44" aria-hidden="true">
            <g class="keys">
              <rect x="6" y="4" width="10" height="9"/><rect x="17" y="4" width="10" height="9"/><rect x="28" y="4" width="10" height="9"/><rect x="39" y="4" width="10" height="9"/><rect x="50" y="4" width="10" height="9"/><rect x="61" y="4" width="10" height="9"/><rect x="72" y="4" width="10" height="9"/><rect x="83" y="4" width="10" height="9"/><rect x="94" y="4" width="10" height="9"/><rect x="105" y="4" width="10" height="9"/>
              <rect x="11" y="14" width="10" height="9"/><rect x="22" y="14" width="10" height="9"/><rect x="33" y="14" width="10" height="9"/><rect x="44" y="14" width="10" height="9"/><rect x="55" y="14" width="10" height="9"/><rect x="66" y="14" width="10" height="9"/><rect x="77" y="14" width="10" height="9"/><rect x="88" y="14" width="10" height="9"/><rect x="99" y="14" width="10" height="9"/>
              <rect x="22" y="24" width="10" height="9"/><rect x="33" y="24" width="10" height="9"/><rect x="44" y="24" width="10" height="9"/><rect x="55" y="24" width="10" height="9"/><rect x="66" y="24" width="10" height="9"/><rect x="77" y="24" width="10" height="9"/><rect x="88" y="24" width="10" height="9"/>
            </g>
            <path class="swipe" pathLength="1" d="M60 18 C 52 8, 34 4, 33 8 S 70 30, 88 18 S 98 8, 100 8"/>
            <circle class="tip" cx="100" cy="8" r="2.6"/>
          </svg>
          <span class="btn-title">Demo</span>
          <span class="btn-sub">gesture typing</span>
        </a>
        <a class="btn game" href="study-funny/display.html">
          <svg class="art art-game" viewBox="0 0 120 44" aria-hidden="true">
            <path class="pad" d="M40 12 h40 c9 0 14 7 16 17 c2 9 -3 13 -8 12 c-4 -1 -7 -6 -11 -9 h-34 c-4 3 -7 8 -11 9 c-5 1 -10 -3 -8 -12 c2 -10 7 -17 16 -17 z"/>
            <path class="dpad" d="M39 19.5 v12 M33 25.5 h12"/>
            <circle class="btn-a" cx="81" cy="19.5" r="2.5"/>
            <circle class="btn-b" cx="87.5" cy="25.5" r="2.5"/>
            <circle class="btn-c" cx="74.5" cy="25.5" r="2.5"/>
            <circle class="btn-d" cx="81" cy="31.5" r="2.5"/>
            <g class="sparks"><path d="M60 2 v5 M50 4 l3 4 M70 4 l-3 4"/></g>
          </svg>
          <span class="btn-title">Game</span>
          <span class="btn-sub">combos, music, scores</span>
        </a>
      </nav>
      <p class="phone-link">No camera on the phone? Open <a href="mobile.html">Mobile</a> and tap the session number.</p>
    </main>
  </body>
</html>
