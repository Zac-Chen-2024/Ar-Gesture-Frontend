<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ar-Gesture</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      /* Editorial look, matching the display's default style: paper, serif
         type, black hairlines, one red accent (the gesture trace). */
      :root {
        --paper: #faf8f3;
        --ink: #111111;
        --ink-soft: rgba(17, 17, 17, 0.62);
        --ink-faint: rgba(17, 17, 17, 0.45);
        --red: var(--accent-main, #d6452b);
        --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino,
          "Book Antiqua", Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 100%;
        max-width: 46rem;
        text-align: center;
      }

      .kicker {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      /* the lab's logo, quietly at the foot of the page */
      .lab-logo {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        height: 48px;
        width: auto;
        overflow: visible;
      }
      /* its pixels rest in the title swipe's grey; over a mode they turn to
         that mode's colour one by one (each flips at once, after its delay) */
      .lab-logo .px {
        fill: #8c908b;
        transition: fill 0s linear var(--d, 0ms);
      }
      body:has(a.btn.demo:hover) .lab-logo .px {
        fill: #25915f;
      }
      body:has(a.btn.game:hover) .lab-logo .px {
        fill: #d6452b;
      }
      @media (prefers-reduced-motion: reduce) {
        .lab-logo .px { transition: none; }
      }
      body {
        position: relative;
        padding-bottom: 120px; /* room for the logo on short screens */
      }

      h1 {
        margin: 14px 0 0;
        font-family: var(--font-serif);
        font-size: clamp(3.4rem, 13vw, 6.4rem);
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1;
      }

      /* a swipe drawn under the title, in the display's trace red */
      .trace {
        display: block;
        width: min(21rem, 74%);
        height: 36px;
        margin: 10px auto 0;
        overflow: visible;
      }

      /* the title's swipe: ink at rest; over a button it takes that mode's
         colour and is drawn again */
      .trace {
        --trace-ink: #8c908b; /* mountain grey at rest */
      }
      .trace path {
        fill: none;
        stroke: var(--trace-ink);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        transition: stroke 220ms ease;
      }
      .trace circle {
        fill: var(--trace-ink);
        transition: fill 220ms ease;
      }
      body:has(a.btn.demo:hover) .trace {
        --trace-ink: #25915f;
      }
      body:has(a.btn.game:hover) .trace {
        --trace-ink: #d6452b;
      }
      .trace.is-drawing path {
        animation: trace-draw 700ms ease-out;
      }
      .trace.is-drawing circle {
        animation: trace-dot 700ms ease-out;
      }
      @keyframes trace-draw {
        from { stroke-dashoffset: 1; }
      }
      @keyframes trace-dot {
        0%, 70% { opacity: 0; transform: scale(0.4); }
        100% { opacity: 1; transform: none; }
      }
      .trace circle {
        transform-box: fill-box;
        transform-origin: center;
      }
      @media (prefers-reduced-motion: reduce) {
        .trace.is-drawing path, .trace.is-drawing circle { animation: none; }
      }

      .lede {
        margin: 22px auto 0;
        max-width: 28rem;
        font-family: var(--font-serif);
        font-size: 1.12rem;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .lede strong {
        font-weight: 400;
        font-style: italic;
        color: var(--ink);
      }

      .links {
        display: grid;
        grid-template-columns: 1fr 1fr;
        margin-top: 46px;
        border: 1px solid var(--ink);
      }

      a.btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 30px 20px 26px;
        text-decoration: none;
        color: var(--ink);
        transition: background-color 140ms ease, color 140ms ease;
      }

      a.btn + a.btn {
        border-left: 1px solid var(--ink);
      }

      a.btn .btn-title {
        transition: color 140ms ease;
      }
      /* each mode has its own colour: Demo green, Game red */
      a.btn.demo {
        --btn-accent: #25915f;
        --btn-tint: rgba(37, 145, 95, 0.07);
      }
      a.btn.game {
        --btn-accent: #d6452b;
        --btn-tint: rgba(214, 69, 43, 0.07);
      }

      .btn-title {
        font-family: var(--font-serif);
        font-size: 2.2rem;
        line-height: 1.1;
      }

      .btn-sub {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        opacity: 0.6;
      }

      a.btn:hover {
        background: var(--btn-tint, rgba(17, 17, 17, 0.06));
      }

      a.btn:hover .btn-title {
        color: var(--btn-accent);
      }

      a.btn:focus-visible {
        outline: 2px solid var(--btn-accent);
        outline-offset: -4px;
      }

      .phone-link {
        margin: 18px 0 0;
        font-family: var(--font-serif);
        font-size: 1.1rem;
        color: var(--ink-faint);
      }
      .phone-link a {
        color: var(--ink-soft);
      }

      /* each mode button carries its own small picture */
      .art {
        display: block;
        width: 168px;
        height: 62px;
        margin-bottom: 6px;
        overflow: visible;
      }
      .art-demo .keys rect {
        fill: none;
        stroke: rgba(17, 17, 17, 0.35);
        stroke-width: 0.8;
      }
      .art-demo .swipe {
        fill: none;
        stroke: var(--btn-accent);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
      }
      .art-demo .tip {
        fill: var(--btn-accent);
      }
      a.btn:hover .art-demo .swipe {
        animation: art-draw 900ms ease-out;
      }
      @keyframes art-draw {
        from { stroke-dashoffset: 1; }
        to { stroke-dashoffset: 0; }
      }
      .art-game .pad {
        fill: var(--paper);
        stroke: var(--ink);
        stroke-width: 1.5;
        stroke-linejoin: round;
      }
      .art-game .shoulder {
        fill: none;
        stroke: var(--ink);
        stroke-width: 1.5;
        stroke-linecap: round;
      }
      .art-game .dpad,
      .art-game .mid {
        fill: var(--ink);
      }
      .art-game .btn-a, .art-game .btn-b { fill: var(--btn-accent); }
      .art-game .btn-c, .art-game .btn-d { fill: var(--ink); }
      .art-game .sparks {
        stroke: var(--btn-accent);
        stroke-width: 1.6;
        stroke-linecap: round;
        opacity: 0;
        transition: opacity 200ms ease, transform 260ms cubic-bezier(.2, 1.6, .4, 1);
        transform-origin: 60px 8px;
        transform: translateY(4px);
      }
      a.btn:hover .art-game { animation: art-wiggle 420ms ease-in-out; }
      a.btn:hover .art-game .sparks { opacity: 1; transform: none; }
      a.btn:hover .art-game .btn-a { animation: art-press 420ms ease-in-out; }
      @keyframes art-wiggle {
        25% { transform: rotate(-5deg); }
        60% { transform: rotate(4deg); }
      }
      @keyframes art-press {
        40% { transform: translateY(1.5px); fill: var(--ink); }
      }
      .art-game .btn-a { transform-box: fill-box; }
      @media (prefers-reduced-motion: reduce) {
        a.btn:hover .art-demo .swipe, a.btn:hover .art-game, a.btn:hover .art-game .btn-a { animation: none; }
      }

      /* Demo: leaves sprout along the swipes (index script places them) */
      .leaf path {
        fill: #25915f;
        transform-box: fill-box;
        transform-origin: left center;
        transform: scale(0);
        transition: transform 240ms ease-in;
      }
      .leaf.is-dark path {
        fill: #1c6f49;
      }
      body:has(a.btn.demo:hover) .leaf path {
        transform: scale(1);
        transition: transform 420ms cubic-bezier(0.2, 1.6, 0.4, 1) var(--grow, 0ms);
      }
      /* Game: quench sparks are drawn on this layer */
      .sparks-layer {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .leaf path { transition: none !important; }
      }

      @media (max-width: 420px) {
        .links {
          grid-template-columns: 1fr;
        }

        a.btn + a.btn {
          border-left: none;
          border-top: 1px solid var(--ink);
        }
      }
    </style>
    <script src="transition.js?v=20261007-4"></script>
  </head>

    <script>
      // A mode button: the page fades and the XBLab mark draws itself first.
      document.querySelectorAll("a.btn.demo, a.btn.game").forEach((a) => {
        a.addEventListener("click", (e) => {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
          e.preventDefault();
          window.XBLTransition.go(a.href, a.classList.contains("game") ? "red" : "green");
        });
      });
    </script>
    <script>
      // Hovering a mode: the title's swipe is drawn again in that mode's colour.
      // Demo grows leaves along the swipes; Game throws quench sparks from the
      // pen tip, the end of the line and the gamepad.
      (() => {
        const trace = document.querySelector(".trace");
        const tracePath = trace.querySelector("path");
        const demo = document.querySelector("a.btn.demo");
        const game = document.querySelector("a.btn.game");
        const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const SVGNS = "http://www.w3.org/2000/svg";
        const DRAW_MS = 700;

        // ---- leaves: pairs along a path, alternating sides, later ones later
        function sprout(path, count, size, delayMs) {
          const svg = path.ownerSVGElement;
          const len = path.getTotalLength();
          for (let i = 1; i <= count; i++) {
            const t = i / (count + 1);
            const p = path.getPointAtLength(len * t);
            const q = path.getPointAtLength(Math.min(len, len * t + 0.5));
            const angle = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI;
            const side = i % 2 ? -1 : 1;
            const g = document.createElementNS(SVGNS, "g");
            g.setAttribute("class", "leaf" + (i % 3 === 0 ? " is-dark" : ""));
            g.setAttribute("transform", `translate(${p.x} ${p.y}) rotate(${angle + side * 50}) scale(${size})`);
            g.style.setProperty("--grow", `${Math.round(delayMs * t)}ms`);
            const leaf = document.createElementNS(SVGNS, "path");
            leaf.setAttribute("d", "M0 0 C 2.5 -3.4, 7.5 -3.6, 11 0 C 7.5 2.2, 2.5 2.2, 0 0 Z");
            g.appendChild(leaf);
            svg.insertBefore(g, path.nextSibling);
          }
        }
        sprout(tracePath, 9, 1.05, DRAW_MS);
        sprout(document.querySelector(".art-demo .swipe"), 6, 0.6, 600);

        // ---- sparks: a canvas over the page
        const canvas = document.createElement("canvas");
        canvas.className = "sparks-layer";
        document.body.appendChild(canvas);
        const ctx = canvas.getContext("2d");
        let sparks = [];
        let running = false;
        function size() {
          const dpr = devicePixelRatio || 1;
          canvas.width = innerWidth * dpr;
          canvas.height = innerHeight * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        addEventListener("resize", size);
        size();

        // on paper: gold, then orange, then red, cooling to a dark ember
        function colour(life) {
          if (life > 0.75) return "rgb(245, 178, 30)";
          if (life > 0.5) return "rgb(240, 120, 32)";
          if (life > 0.25) return "rgb(214, 69, 43)";
          return `rgba(140, 36, 20, ${life * 4})`;
        }
        function spray(x, y, n, { up = 0, spread = Math.PI, speed = 5 } = {}) {
          if (calm) return;
          for (let i = 0; i < n; i++) {
            const a = -Math.PI / 2 + up + (Math.random() - 0.5) * spread;
            const v = speed * (0.4 + Math.random());
            sparks.push({ x, y, px: x, py: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
              life: 1, decay: 0.014 + Math.random() * 0.024 });
          }
          if (!running) { running = true; requestAnimationFrame(step); }
        }
        function step() {
          ctx.clearRect(0, 0, innerWidth, innerHeight);
          sparks = sparks.filter((s) => s.life > 0);
          for (const s of sparks) {
            s.px = s.x; s.py = s.y;
            s.vy += 0.22; s.vx *= 0.985;
            s.x += s.vx; s.y += s.vy;
            s.life -= s.decay;
            ctx.strokeStyle = colour(Math.max(0, s.life));
            ctx.lineWidth = 1.6 + s.life * 1.8;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(s.px - s.vx * 2.2, s.py - s.vy * 2.2);
            ctx.lineTo(s.x, s.y);
            ctx.stroke();
          }
          if (sparks.length) requestAnimationFrame(step);
          else running = false;
        }
        // a point of an svg path, on the page
        function onPage(path, at) {
          const p = path.getPointAtLength(at).matrixTransform(path.getScreenCTM());
          return { x: p.x, y: p.y };
        }

        let embers = null;
        let tipRun = 0;
        function forge() {
          const run = ++tipRun;
          const len = tracePath.getTotalLength();
          const t0 = performance.now();
          // the pen tip throws sparks as the line is drawn (ease-out, as the css)
          (function tip(now) {
            if (run !== tipRun) return;
            const k = Math.min(1, (now - t0) / DRAW_MS);
            const eased = 1 - Math.pow(1 - k, 3);
            const p = onPage(tracePath, len * eased);
            spray(p.x, p.y, 3, { spread: Math.PI * 0.9, speed: 3.2 });
            if (k < 1) requestAnimationFrame(tip);
            else {
              const end = onPage(tracePath, len);
              spray(end.x, end.y, 30, { spread: Math.PI * 1.5, speed: 5.2 });
            }
          })(t0);
          // the gamepad spits embers while the cursor stays
          const pad = game.querySelector(".art-game").getBoundingClientRect();
          spray(pad.left + pad.width / 2, pad.top + 4, 30, { spread: Math.PI * 0.8, speed: 5.5 });
          clearInterval(embers);
          embers = setInterval(() => {
            const r = game.querySelector(".art-game").getBoundingClientRect();
            spray(r.left + r.width / 2, r.top + 4, 3, { spread: Math.PI * 0.6, speed: 4.2 });
          }, 110);
        }

        function redraw() {
          trace.classList.remove("is-drawing");
          void trace.getBoundingClientRect();
          trace.classList.add("is-drawing");
        }
        demo.addEventListener("mouseenter", redraw);
        game.addEventListener("mouseenter", () => { redraw(); forge(); });
        game.addEventListener("mouseleave", () => { clearInterval(embers); tipRun++; });
      })();
    </script>
