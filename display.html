<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gesture Display</title>
    <link rel="stylesheet" href="styles.css?v=20260917-4" />
  </head>
  <body class="display-body">
    <main class="display-stage">
      <section class="display-frame" aria-label="Gesture display area">
        <header class="top-bar">
          <div class="settings-row">
            <label class="setting">
              <span class="setting-label">Algorithm</span>
              <select id="algo-version" class="mode-select" aria-label="Algorithm version"></select>
            </label>
            <!-- Mapping is hidden for now: always Relative. Kept for later —
                 uncomment to bring the selector back (display.js handles both).
            <label class="setting">
              <span class="setting-label">Mapping</span>
              <select id="mapping-mode" class="mode-select" aria-label="Mapping mode">
                <option value="relative">Relative</option>
                <option value="absolute">Absolute</option>
              </select>
            </label>
            -->
            <div class="setting">
              <span class="setting-label">Word start</span>
              <select id="input-mode" class="mode-select" aria-label="Input mode" hidden>
                <option value="center">Center</option>
                <option value="continuous" selected>Continuous</option>
              </select>
              <div class="segmented" id="input-mode-switch" role="radiogroup" aria-label="Input mode">
                <button type="button" role="radio" data-value="center">Center</button>
                <button type="button" role="radio" data-value="continuous">Continuous</button>
              </div>
            </div>
            <!-- Trace is hidden for now: always Gesture (cursor + drawn trail;
                 Cursor = dot only). Kept for later — uncomment to bring it back.
            <label class="setting">
              <span class="setting-label">Trace</span>
              <select id="visual-mode" class="mode-select" aria-label="Visualization mode">
                <option value="cursor">Cursor</option>
                <option value="gesture">Gesture</option>
              </select>
            </label>
            -->
            <!-- Phone keys is hidden for now: always Hide. Kept for later —
                 uncomment to bring the selector back (display.js handles both).
            <label class="setting">
              <span class="setting-label">Phone keys</span>
              <select id="mobile-keyboard-mode" class="mode-select" aria-label="Mobile keyboard reference">
                <option value="show">Show</option>
                <option value="hide" selected>Hide</option>
              </select>
            </label>
            -->
            <div class="setting" id="device-setting">
              <span class="setting-label">Device</span>
              <div class="segmented" id="device-mode" role="radiogroup" aria-label="Input device">
                <button type="button" role="radio" data-value="touchpad">Touchpad</button>
                <button type="button" role="radio" data-value="phone">Phone</button>
              </div>
            </div>
            <span class="setting-arrow" id="link-arrow" aria-hidden="true">›</span>
            <div class="setting" id="link-setting">
              <span class="setting-label">Link</span>
              <!-- the select stays the source of truth for display.js; the
                   segmented buttons just drive it -->
              <select id="lan-mode" class="mode-select" aria-label="Gesture transport" hidden>
                <option value="server">Remote</option>
                <option value="lan">LAN</option>
                <option value="usb">USB</option>
              </select>
              <div class="segmented" id="link-mode" role="radiogroup" aria-label="Gesture transport">
                <button type="button" role="radio" data-value="server">Remote</button>
                <!-- LAN is hidden for now; the select option stays for later
                <button type="button" role="radio" data-value="lan">LAN</button>
                -->
                <button type="button" role="radio" data-value="usb">USB</button>
              </div>
            </div>
            <span class="setting-arrow" id="usb-arrow" aria-hidden="true">›</span>
            <div class="setting" id="usb-setting">
              <span class="setting-label">USB</span>
              <button id="usb-connect" class="mode-select usb-connect" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>Connect phone</button>
            </div>
          </div>
          <div id="room-code" class="room-code">
            <span class="room-code-label">Session</span>
            <span class="room-code-value">····</span>
            <span class="room-code-status">waiting for phone…</span>
          </div>
        </header>
        <div class="text-row">
          <div id="decoded-text" class="decoded-text" aria-live="polite"></div>
          <div id="letter-badge" class="letter-badge" aria-hidden="true"></div>
        </div>
        <div class="keyboard-shell">
          <div id="candidate-strip" class="candidate-strip" aria-label="Word candidates and actions"></div>
          <div class="keyboard-row">
            <div class="key" data-key="Q">Q</div>
            <div class="key" data-key="W">W</div>
            <div class="key" data-key="E">E</div>
            <div class="key" data-key="R">R</div>
            <div class="key" data-key="T">T</div>
            <div class="key" data-key="Y">Y</div>
            <div class="key" data-key="U">U</div>
            <div class="key" data-key="I">I</div>
            <div class="key" data-key="O">O</div>
            <div class="key" data-key="P">P</div>
          </div>
          <div class="keyboard-row keyboard-row-offset-sm">
            <div class="key" data-key="A">A</div>
            <div class="key" data-key="S">S</div>
            <div class="key" data-key="D">D</div>
            <div class="key" data-key="F">F</div>
            <div class="key key-anchor" data-key="G">G</div>
            <div class="key" data-key="H">H</div>
            <div class="key" data-key="J">J</div>
            <div class="key" data-key="K">K</div>
            <div class="key" data-key="L">L</div>
          </div>
          <div class="keyboard-row keyboard-row-offset-lg">
            <div class="key" data-key="Z">Z</div>
            <div class="key" data-key="X">X</div>
            <div class="key" data-key="C">C</div>
            <div class="key" data-key="V">V</div>
            <div class="key" data-key="B">B</div>
            <div class="key" data-key="N">N</div>
            <div class="key" data-key="M">M</div>
          </div>
          <div class="action-strip" aria-hidden="true">
            <span id="action-clear" class="action-pill">Clear</span>
          </div>
        </div>
        <div id="cursor-marker" class="cursor-marker" aria-hidden="true"></div>
        <canvas id="display-canvas"></canvas>
        <div id="build-badge" class="build-badge" aria-hidden="true"></div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch display style"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none"/></svg></button>
        <!-- Dictionary picker: hidden for now (server default lexicon is used)
        <div class="lexicon-picker">
          <button id="lexicon-toggle" class="lexicon-toggle" type="button" aria-label="Local-AOM dictionary" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9.5 12.5l2-5 2 5M10.2 10.8h2.6"/></svg></button>
          <div id="lexicon-menu" class="lexicon-menu" role="menu" aria-label="Local-AOM dictionary" hidden>
            <div class="lexicon-menu-title">Dictionary <span id="lexicon-menu-note" class="lexicon-menu-note">Local-AOM</span></div>
            <div id="lexicon-options" class="lexicon-options"></div>
          </div>
        </div>
        -->
        <div id="lan-badge" class="lan-badge" aria-hidden="true">LAN ⚡</div>
        <div id="usb-status" class="usb-status" aria-live="polite" hidden></div>
        <div id="touchpad-hint" class="touchpad-hint" aria-live="polite" hidden></div>
      </section>
      <!-- Decode-score panel: commented out (kept for later)
      <aside id="score-panel" class="score-panel collapsed" aria-label="Decode scores">
        <div class="score-panel-title">
          <span class="score-panel-text">Decode scores <span class="score-panel-note">top-10 · v3</span></span>
          <button id="score-collapse" class="score-chevron" type="button" aria-label="Collapse score panel">»</button>
        </div>
        <div class="score-body">
          <div class="score-grid">
            <div class="score-cell">
              <div class="score-col-head" id="head-path">① Path score</div>
              <div id="list-path" class="score-list"></div>
            </div>
            <div class="score-cell">
              <div class="score-col-head" id="head-shape">② + Shape (SHARK²)</div>
              <div id="list-shape" class="score-list"></div>
            </div>
            <div class="score-cell">
              <div class="score-col-head" id="head-final">③ + Bigram (final)</div>
              <div id="list-final" class="score-list"></div>
            </div>
            <div class="score-cell">
              <div class="score-col-head" id="head-extra">④ Reserved</div>
              <div id="list-extra" class="score-list"></div>
            </div>
          </div>
          <div class="score-params">
            <div class="score-col-head">Parameters</div>
            <div id="params-runtime" class="score-param-group"></div>
            <div id="params-compiled" class="score-param-group"></div>
          </div>
        </div>
      </aside>
      <button id="score-expand" class="score-expand-tab" type="button" aria-label="Expand score panel">«</button>
      -->
    </main>
    <script src="config.js?v=20260917-4"></script>
    <script src="vendor/adb.bundle.js?v=20260917-4"></script>
    <script src="display.js?v=20260917-4"></script>
  </body>
  </html>
